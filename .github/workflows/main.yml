name: Generate the Feed
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup PY
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run Generator
        uses: gaxkalik/podcast-generator@main

